services:
  web:
    container_name: lanify-web
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      ALLOWED_DEV_ORIGINS: ${ALLOWED_DEV_ORIGINS:-}
      REMBG_SERVICE_URL: http://rembg:7000
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
    ports:
      - '3000:3000'
    depends_on:
      rembg:
        condition: service_healthy

  rembg:
    container_name: lanify-rembg
    build:
      context: ./rembg-service
      dockerfile: Dockerfile
    expose:
      - '7000'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
